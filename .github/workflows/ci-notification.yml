name: Notification Service Production CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Code Quality
  sonarqube:
    uses: QuickHaulTransits/quickhaul-shared/.github/workflows/_sonarqube.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 2. Dependency Scan
  snyk:
    needs: sonarqube
    uses: QuickHaulTransits/quickhaul-shared/.github/workflows/_snyk.yml@main
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 3. Build & Push
  docker:
    needs: snyk
    if: github.event_name == 'push'
    uses: QuickHaulTransits/quickhaul-shared/.github/workflows/_docker-ci.yml@main
    with:
      image-name: quickhaul-notification
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  # 4. Container Scan
  trivy:
    needs: docker
    if: github.event_name == 'push'
    uses: QuickHaulTransits/quickhaul-shared/.github/workflows/_trivy.yml@main
    with:
      image-name: quickhaul-notification
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

  # 5. Vulnerability Notification
  notify-vulnerabilities:
    needs: [snyk, trivy]
    # Runs only if Snyk or Trivy fails
    if: failure() && (needs.snyk.result == 'failure' || needs.trivy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send Brevo Email Notification
        run: |
          curl --request POST \
            --url https://api.brevo.com/v3/smtp/email \
            --header 'accept: application/json' \
            --header 'api-key: ${{ secrets.BREVO_API_KEY }}' \
            --header 'content-type: application/json' \
            --data '{
              "sender": {"name": "QuickHaul CI/CD Security", "email": "security@quickhaul.com"},
              "to": [{"email": "${{ secrets.ALERT_EMAIL }}", "name": "Security Team"}],
              "subject": "🚨 Critical: Vulnerabilities found in Notification Service",
              "htmlContent": "<h3>Security Alert</h3><p>Vulnerabilities were detected by Snyk or Trivy during the CI build for <b>notification-service</b>.</p><p>Please check the <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">GitHub Actions Logs</a> for more details.</p>"
            }'
