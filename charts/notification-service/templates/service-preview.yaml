{{- if eq .Values.strategy.type "Rollout" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.strategy.blueGreen.previewService }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "notification-service.selectorLabels" . | nindent 4 }}
{{- end }}
